spring.application.name=spring-backend
server.port=8080

#logger
logging.level.org.springframework=INFO
logging.level.com.zimpic.backend=DEBUG

# PostgreSQL Setting
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zimpic}
spring.datasource.username=${DB_USERNAME:zimpic_user}
spring.datasource.password=${DB_PASSWORD:0000}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Actuator Setting
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# FastAPI
yolo.base-url=${YOLO_BASE_URL:http://localhost:8000}
yolo.connect-timeout=${YOLO_CONNECT_TIMEOUT:3s}
yolo.read-timeout=${YOLO_READ_TIMEOUT:60s}


# Vision image upload
vision.storage-root=${VISION_STORAGE_ROOT:uploads/vision}
vision.public-path=/media/vision/
vision.max-file-size=10485760
vision.max-image-width=4096
vision.max-image-height=4096
vision.success-retention=24h
vision.failure-retention=7d
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB
